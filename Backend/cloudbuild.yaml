# Cloud Build Pipeline Configuration for GCP Cloud Run & Cloud SQL Deployment
steps:
  # -------------------------------------------------------------------------
  # Step 1: Build Backend Docker Image
  # -------------------------------------------------------------------------
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-backend-image'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/seafudz-backend:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/seafudz-backend:latest'
      - './Backend'

  # -------------------------------------------------------------------------
  # Step 2: Push Backend Image to Google Container Registry
  # -------------------------------------------------------------------------
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-backend-image'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/seafudz-backend:$COMMIT_SHA'

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-backend-image-latest'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/seafudz-backend:latest'

  # -------------------------------------------------------------------------
  # Step 3: Run Database Migrations on GCP Cloud SQL
  # -------------------------------------------------------------------------
  - name: 'node:20'
    id: 'run-database-migrations'
    dir: 'Backend'
    entrypoint: 'bash'
    args:
      - '-c'
      - 'npm ci && npm run migrate'

  # -------------------------------------------------------------------------
  # Step 4: Deploy Backend Container to GCP Cloud Run
  # -------------------------------------------------------------------------
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-backend-cloudrun'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'seafudz-backend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/seafudz-backend:$COMMIT_SHA'
      - '--region'
      - 'asia-southeast1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'

  # -------------------------------------------------------------------------
  # Step 5: Install Dependencies & Build Frontend Production Assets
  # -------------------------------------------------------------------------
  - name: 'node:20'
    id: 'build-frontend'
    dir: 'Frontend'
    entrypoint: 'bash'
    args:
      - '-c'
      - 'npm ci && npm run build'

  # -------------------------------------------------------------------------
  # Step 6: Deploy Frontend Static Distribution to Firebase Hosting
  # -------------------------------------------------------------------------
  - name: 'node:20'
    id: 'deploy-frontend-firebase'
    dir: 'Frontend'
    entrypoint: 'npx'
    args:
      - 'firebase-tools'
      - 'deploy'
      - '--only'
      - 'hosting'
      - '--project'
      - '$PROJECT_ID'

# Store artifact images in Google Container Registry
images:
  - 'gcr.io/$PROJECT_ID/seafudz-backend:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/seafudz-backend:latest'

# Pipeline execution configuration
timeout: '1200s'
options:
  logging: 'CLOUD_LOGGING_ONLY'
